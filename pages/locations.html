<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ubicaciones</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <h1>Beyond the Kingdom</h1>
    <h2>Ubicaciones</h2>
    <p id="locations-status" role="status" aria-live="polite">Cargando ubicaciones...</p>
    <section id="locations-list" class="locations-list" aria-label="Lista de ubicaciones"></section>

    <script>
        const status = document.getElementById("locations-status");
        const locationsList = document.getElementById("locations-list");

        async function showLocations() {
            try {
                const response = await fetch("../resources/locations.json");
                if (!response.ok) {
                    throw new Error(`No se pudo cargar el archivo (${response.status}).`);
                }

                const locations = await response.json();
                if (!Array.isArray(locations)) {
                    throw new Error("El archivo de ubicaciones no tiene un formato válido.");
                }

                const locationsById = new Map(locations.map(location => [location.id, location]));

                locations.forEach(location => {
                    const article = document.createElement("article");
                    article.className = "location-card";

                    const name = document.createElement("h3");
                    name.textContent = location.nombre;
                    article.appendChild(name);

                    const description = document.createElement("p");
                    description.textContent = location.descripcion || "Sin descripción disponible.";
                    article.appendChild(description);

                    const connectedIds = Array.isArray(location.conectado_a) ? location.conectado_a : [];
                    if (connectedIds.length > 0) {
                        const connectionsTitle = document.createElement("h4");
                        connectionsTitle.textContent = "Ubicaciones conectadas";
                        article.appendChild(connectionsTitle);

                        const connections = document.createElement("ul");
                        connectedIds.forEach(id => {
                            const item = document.createElement("li");
                            item.textContent = locationsById.get(id)?.nombre || `Ubicación ${id}`;
                            connections.appendChild(item);
                        });
                        article.appendChild(connections);
                    }

                    locationsList.appendChild(article);
                });

                status.textContent = `${locations.length} ubicaciones cargadas.`;
            } catch (error) {
                status.textContent = `Error al cargar las ubicaciones: ${error.message}`;
            }
        }

        showLocations();
    </script>
</body>
</html>
